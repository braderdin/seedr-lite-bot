name: Deploy Seedr-Lite to OCI VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Nyahsulit Kunci SSH (GPG)
        env:
          PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mkdir -p ~/.ssh
          gpg --quiet --batch --yes --decrypt --passphrase "$PASSPHRASE" \
            --output ~/.ssh/id_rsa \
            oci_gpg_key/ssh-key-2026-07-27.key.gpg
          chmod 600 ~/.ssh/id_rsa

      - name: Sync Fail ke OCI VM (Native Rsync)
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USERNAME: ${{ secrets.OCI_USERNAME }}
        run: |
          rsync -avz --delete \
            --exclude='.git*' \
            --exclude='venv/' \
            --exclude='__pycache__/' \
            --exclude='*.log' \
            --exclude='downloads/' \
            -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
            ./ $OCI_USERNAME@$OCI_HOST:/home/ubuntu/seedr-lite-bot/

      - name: Pasang Dependencies & Restart Systemd Service (Native SSH)
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USERNAME: ${{ secrets.OCI_USERNAME }}
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no $OCI_USERNAME@$OCI_HOST << 'EOF'
            cd /home/ubuntu/seedr-lite-bot
            python3 -m venv venv
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            sudo systemctl restart seedr-bot
            echo "🚀 Deployment & restart perkhidmatan systemd berjaya!"
          EOF
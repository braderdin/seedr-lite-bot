name: Deploy Seedr-Lite to OCI VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Nyahsulit Kunci SSH (GPG)
        env:
          PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mkdir -p ~/.ssh
          gpg --quiet --batch --yes --decrypt --passphrase "$PASSPHRASE" \
            --output ~/.ssh/id_rsa \
            oci_gpg_key/ssh-key-2026-07-27.key.gpg
          chmod 600 ~/.ssh/id_rsa

      - name: Sync Fail ke OCI VM (Native Rsync)
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USERNAME: ${{ secrets.OCI_USERNAME }}
        run: |
          rsync -avz \
            --exclude='.env*' \
            --exclude='.env.local' \
            --exclude='.git*' \
            --exclude='venv/' \
            --exclude='__pycache__/' \
            --exclude='*.log' \
            --exclude='downloads/' \
            --exclude='.req_hash' \
            -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o ServerAliveInterval=60" \
            ./ $OCI_USERNAME@$OCI_HOST:/home/ubuntu/seedr-lite-bot/

      - name: Pasang Dependencies & Restart Systemd Service (Native SSH)
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USERNAME: ${{ secrets.OCI_USERNAME }}
        run: |
          ssh -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=60 \
            -o ServerAliveCountMax=10 \
            $OCI_USERNAME@$OCI_HOST << 'EOF'
            set -e
            cd /home/ubuntu/seedr-lite-bot
            
            # 1. Cipta venv jika belum wujud
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            source venv/bin/activate

            # 2. Pengurusan Cache Pip OCI
            mkdir -p ~/.cache/pip
            find ~/.cache/pip -type f -mtime +5 -delete 2>/dev/null || true

            # 3. Semak Hash requirements.txt untuk melangkau pemasangan jika tiada perubahan
            NEW_HASH=$(sha256sum requirements.txt | awk '{print $1}')
            OLD_HASH=$(cat .req_hash 2>/dev/null || echo "")

            if [ "$NEW_HASH" != "$OLD_HASH" ]; then
              echo "📦 requirements.txt berubah. Memasang pakej baru..."
              pip install --prefer-binary -r requirements.txt
              echo "$NEW_HASH" > .req_hash
            else
              echo "⚡ Tiada perubahan pada requirements.txt. Melangkau pip install!"
            fi

            # 4. Restart perkhidmatan systemd
            sudo systemctl restart seedr-bot
            echo "🚀 Deployment & restart perkhidmatan systemd berjaya!"
          EOF